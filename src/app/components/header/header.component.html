<mat-toolbar color="primary" class="app-header">
  <button mat-icon-button (click)="toggleSidenav.emit()" aria-label="Toggle sidenav" class="sidenav-toggle-button">
    <mat-icon>menu</mat-icon>
  </button>
  <span class="logo">CleanApp</span>

  <!-- CSS class 'hide-on-small' will be used instead of fxShow/fxHide -->
  <div class="header-nav-links"> 
    <a mat-button routerLink="/home" routerLinkActive="active-link" [routerLinkActiveOptions]="{exact: true}" ariaCurrentWhenActive="page">Home</a>
    <a mat-button routerLink="/projects" routerLinkActive="active-link" ariaCurrentWhenActive="page">Projects</a>
    <a mat-button routerLink="/tasks" routerLinkActive="active-link" ariaCurrentWhenActive="page">Tasks</a>
    <a mat-button routerLink="/reports" routerLinkActive="active-link" ariaCurrentWhenActive="page">Reports</a>
  </div>

  <span class="toolbar-spacer"></span>

  <button mat-icon-button aria-label="Search">
    <mat-icon>search</mat-icon>
  </button>
  <button mat-icon-button aria-label="Notifications">
    <mat-icon>notifications</mat-icon>
  </button>
  <button mat-icon-button aria-label="Settings">
    <mat-icon>settings</mat-icon>
  </button>
</mat-toolbar>
