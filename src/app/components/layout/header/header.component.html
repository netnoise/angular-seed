<mat-toolbar class="header__toolbar" color="primary" role="banner">
  <div
    class="header__logo-section"
    (click)="onLogoClick($event)"
    (keydown.enter)="onLogoClick($event)"
    tabindex="0"
    role="button"
    aria-label="Go to homepage"
  >
    <!-- If logo were an image: <img src="assets/logo.svg" alt="Demo Project Home"> -->
    <span>Demo Project</span>
  </div>

  <nav class="header__navigation" aria-label="Main navigation">
    <ul role="menubar">
      <li role="none">
        <a
          mat-button
          routerLink="/"
          routerLinkActive="active-link"
          #rlaHome="routerLinkActive"
          [attr.aria-current]="rlaHome.isActive ? 'page' : null"
          role="menuitem"
          >Home</a
        >
      </li>
      <li role="none">
        <a
          mat-button
          routerLink="/features"
          routerLinkActive="active-link"
          #rlaFeatures="routerLinkActive"
          [attr.aria-current]="rlaFeatures.isActive ? 'page' : null"
          role="menuitem"
          >Features</a
        >
      </li>
      <li role="none">
        <a
          mat-button
          routerLink="/about"
          routerLinkActive="active-link"
          #rlaAbout="routerLinkActive"
          [attr.aria-current]="rlaAbout.isActive ? 'page' : null"
          role="menuitem"
          >About</a
        >
      </li>
    </ul>
  </nav>

  <div class="header__settings-section" role="toolbar" aria-label="User settings">
    <button
      mat-button
      class="language-selector"
      aria-label="Select language, current: English"
      aria-haspopup="true"
      aria-expanded="false"
    >
      <mat-icon aria-hidden="true">language</mat-icon>
      <span>EN</span>
    </button>
    <!-- Example:
    <button mat-icon-button aria-label="Settings">
      <mat-icon>settings</mat-icon>
    </button>
    -->
  </div>

  <button
    mat-icon-button
    class="header__burger-menu"
    (click)="onToggleSidenav()"
    aria-label="Toggle navigation menu"
    [attr.aria-expanded]="ariaExpandedState"
    aria-controls="appSidenav"
    aria-haspopup="true"
  >
    <mat-icon aria-hidden="true">menu</mat-icon>
  </button>
</mat-toolbar>
