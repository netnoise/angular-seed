<aside
  [class]="sidebarClasses()"
  [cdkTrapFocus]="layoutService.mobileMenuOpen()"
  [cdkTrapFocusAutoCapture]="layoutService.mobileMenuOpen()">
  <button
    class="toggle-btn"
    (click)="onToggle()"
    [attr.aria-label]="sidebarOpen() ? 'Collapse sidebar' : 'Expand sidebar'"
    [attr.aria-expanded]="sidebarOpen()">
    <span class="toggle-icon">{{ sidebarOpen() ? '◀' : '▶' }}</span>
  </button>

  <nav
    class="sidebar-nav"
    role="navigation"
    aria-label="Main navigation">
    @for (item of navigationItems; track item.route) {
      <a
        [routerLink]="item.route"
        [routerLinkActiveOptions]="{ exact: item.exact ?? false }"
        routerLinkActive="active"
        class="sidebar-item"
        [attr.title]="item.label">
        <span class="item-icon">{{ item.icon }}</span>
        @if (sidebarOpen()) {
          <span class="item-label">{{ item.label }}</span>
        }
      </a>
      @if (item.children && sidebarOpen()) {
        @for (child of item.children; track child.route) {
          <a
            [routerLink]="child.route"
            [routerLinkActiveOptions]="{ exact: child.exact ?? false }"
            routerLinkActive="active"
            class="sidebar-item sidebar-child"
            [attr.title]="child.label">
            <span class="item-icon">{{ child.icon }}</span>
            <span class="item-label">{{ child.label }}</span>
          </a>
        }
      }
    }
  </nav>
</aside>
