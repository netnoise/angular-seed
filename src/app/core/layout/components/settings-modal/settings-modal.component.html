<div
  class="modal-backdrop"
  (click)="close()"
  role="button"
  tabindex="0"
  (keydown.escape)="close()"
  aria-label="Close modal">
  <div
    class="modal-content"
    (click)="$event.stopPropagation()"
    (keydown)="$event.stopPropagation()"
    tabindex="0"
    cdkTrapFocus
    cdkTrapFocusAutoCapture>
    <header class="modal-header">
      <h2>Settings</h2>
      <button
        class="close-btn"
        (click)="close()"
        aria-label="Close"
        cdkFocusInitial>
        ×
      </button>
    </header>
    <div class="modal-body">
      <p>Global application settings will be displayed here.</p>
      <!-- Future: Add router-outlet for specific settings tabs -->
    </div>
  </div>
</div>
