<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>AngularSeed</title>
    <base href="/" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="assets/favicon.svg" />
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com" />
    <link
      rel="dns-prefetch"
      href="https://fonts.googleapis.com" />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin />
    <link
      rel="dns-prefetch"
      href="https://fonts.gstatic.com" />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Syne:wght@600;700;800&display=swap" />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Syne:wght@600;700;800&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media = 'all'" />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Syne:wght@600;700;800&display=swap"
        rel="stylesheet" />
    </noscript>
    <style>
      :root {
        --bg-primary: #0a0e1a;
        --bg-secondary: #151b2e;
        --sidebar-width: 250px;
        --header-height: 64px;
      }
      html,
      body {
        background-color: var(--bg-primary);
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        overflow: hidden;
      }
      /* Critical Shell Layout Skeleton */
      .app-shell {
        display: grid;
        height: 100vh;
        width: 100vw;
        grid-template-rows: var(--header-height) 1fr auto;
        grid-template-columns: var(--sidebar-width) 1fr;
        grid-template-areas:
          'header header'
          'sidebar main'
          'footer footer';
      }
      .app-header {
        grid-area: header;
        background-color: var(--bg-secondary);
        height: var(--header-height);
      }
      .sidebar {
        grid-area: sidebar;
        background-color: var(--bg-secondary);
      }
      @media (max-width: 767px) {
        .app-shell {
          grid-template-columns: 1fr;
          grid-template-areas:
            'header header'
            'main main'
            'footer footer';
        }
      }
    </style>
  </head>
  <body>
    <app-root>
      <div class="app-shell">
        <div class="app-header"></div>
        <div class="sidebar"></div>
      </div>
    </app-root>
  </body>
</html>
